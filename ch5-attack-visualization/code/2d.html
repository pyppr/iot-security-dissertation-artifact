  <script>

    d3.select("#draw").on("click", function (d) {
      var graphType1 = d3.select("#graphType1").node().value;
      var devices1 = d3.select("#devices1").node().value;
      var graphType2 = d3.select("#graphType2").node().value;
      var devices2 = d3.select("#devices2").node().value;
      var deviceName = {'ArloQ Camera.csv': "ArloQ Camera", 'Atomi Coffee Maker.csv': "Atomi Coffee Maker", 'Borun Camera.csv': "Borun Camera", 'Eufy Home Base.csv': "Eufy Home Base", 'Globe Lamp.csv': "Globe Lamp", 'Gosund Plug - Roomba.csv': "Gosund Plug - Roomba", 'HeimVision Camera.csv': "HeimVision Camera", 'Netatmo Camera.csv': "Netatmo Camera", 'Philips Hue Bridge.csv': "Philips Hue Bridge", 'Ring Basestation.csv': "Ring Basestation", 'SimCam.csv': "SimCam"};

      var httpPath1 = "".concat("data_count/", graphType1, "/HTTP/", devices1);
      var tcpPath1 = "".concat("data_count/", graphType1, "/TCP/", devices1);
      var udpPath1 = "".concat("data_count/", graphType1, "/UDP/", devices1);
      var httpPath2 = "".concat("data_count/", graphType2, "/HTTP/", devices2);
      var tcpPath2 = "".concat("data_count/", graphType2, "/TCP/", devices2);
      var udpPath2 = "".concat("data_count/", graphType2, "/UDP/", devices2);
      var divIndex = ["graph1http", "graph1tcp", "graph1udp", "graph2http", "graph2tcp", "graph2udp"];
      var divIndexForHtml = ["#graph1http", "#graph1tcp", "#graph1udp", "#graph2http", "#graph2tcp", "#graph2udp"];

      Promise.all([
        d3.csv(httpPath1),
        d3.csv(tcpPath1),
        d3.csv(udpPath1),
        d3.csv(httpPath2),
        d3.csv(tcpPath2),
        d3.csv(udpPath2)
      ]).then(function (files) {
        // console.log(files)
        var maxX = 0
        var minX = 9999999999999
        var maxY = 0
        files.forEach((data, index) => {
          maxX = Math.max(maxX, parseInt(d3.max(data, d => d.value)));
          minX = Math.min(minX, parseInt(d3.min(data, d => d.value)));
          maxY = Math.max(maxY, parseInt(d3.min(data, d => d.count))); 
        });
        var layout = {
          autosize: true,
          xaxis: { range: [minX, maxX] },
          yaxis: { range: [0, maxY] },
          // width: 800,
          height: 450,
          // title: title,
          margin: {
            l: 25,
            r: 20,
            b: 10,
            t: 10
          }
        };

        files.forEach((rows, index) => {
          
        function unpack(rows, key) {
          return rows.map(function (row) { return row[key]; });
        }
          // console.log(err, rows)
          var trace1 = {
            x: unpack(rows, 'value'), y: unpack(rows, 'count'),
            mode: 'markers',
            marker: {
              size: 6,
              // line: {
              //     color: 'rgba(217, 217, 217, 0.14)',
              //     width: 0.0001
              // },
              opacity: 1
            },
            type: 'scatter',
            transforms: [{
              type: 'groupby',
              groups: unpack(rows, 'round'),
              styles: [
                { target: 'round1', value: { marker: { color: 'blue' } } },
                { target: 'round2', value: { marker: { color: 'red' } } },
                { target: 'round3', value: { marker: { color: 'black' } } }
              ]
            }]
          };
          if (rows.length == 0) {
          d3.select(divIndexForHtml[index]).html("<h5>No Data</h5>")
        } else {
          Plotly.newPlot(divIndex[index], [trace1], layout);
        }
          
        });   

      }).catch(function (err) {
        console.log(err)
      })
    });
 
  </script>
