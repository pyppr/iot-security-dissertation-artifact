  <script>

    function drawGraph(graphName, graphId, footerId) {
      var protocol = d3.select("#protocol").node().value;
      var devices = d3.select("#devices").node().value;
      var graphMode = d3.select("#mode").node().value;
      var grdot_size = parseFloat(d3.select("#dot_size").node().value);
      var cx = d3.select("#cx").node().value;
      var cy = d3.select("#cy").node().value;
      var cz = d3.select("#cz").node().value;
      var deviceName = { 'ArloQ Camera.csv': "ArloQ Camera", 'Atomi Coffee Maker.csv': "Atomi Coffee Maker", 'Borun Camera.csv': "Borun Camera", 'Eufy Home Base.csv': "Eufy Home Base", 'Globe Lamp.csv': "Globe Lamp", 'Gosund Plug - Roomba.csv': "Gosund Plug - Roomba", 'HeimVision Camera.csv': "HeimVision Camera", 'Netatmo Camera.csv': "Netatmo Camera", 'Philips Hue Bridge.csv': "Philips Hue Bridge", 'Ring Basestation.csv': "Ring Basestation", 'SimCam.csv': "SimCam" };
      var axisName = { 'time': "Time", 'src': "Source Address", 'srcport': "Source Port", 'dst': "Destination Address", 'dstport': "Destination Port", 'length': "Packet Size", 'protocols': "Protocol Type", 'info': "Info", 'round': "Round" };

      var title = "";
      title = title.concat(protocol, " ", deviceName[devices]);
      var filename = "";
      filename = filename.concat("data_aggregation/", protocol, "/", devices);
      // console.log(filename);
      var footerText = "";
      footerText = footerText.concat("Protocol: ", protocol, "<br>Device: ", deviceName[devices], "<br>X: ", axisName[cx], "<br>Y: ", axisName[cy], "<br>Z: ", axisName[cz],);
      d3.select(footerId).html(footerText)
      d3.csv(filename, function (err, rows) {
        function unpackWithCon(rows, key, key_con1, con1, key_con2, con2) {
          return rows.map(function (row) {
            if (row[key_con1] == con1 && row[key_con2] == con2) {
            // if (row[key_con] == con && parseInt(row['no.']) < 100000) {
              // console.log(row['no.'])
              return row[key];
            }
          });
        }
        function unpackAll(rows, key) {
          return rows.map(function (row) {
            return row[key];
          });
        }
        var rounds = ['round1','round2','round3'];
        // var rounds = ['round1','round2','round3'];
        var data_types = ['attacker', 'victim', 'other'];
        // attack vs victim vs others use shape
        var shape = ['diamond','circle','x']; 
        var line_type = ['solid', 'dash', 'dot']
        // continues data use colors 
        var colors = ['#00008B','#1E90FF','#00FFFF'];
        // attack_r1 vic_r1 oth_r1 ... oth_r3
        // var colorsForLines = ['#d73027','#f46d43','#fdae61', '#2166ac','#4393c3','#92c5de', '#8c510a','#bf812d','#dfc27d'];
        var colorsForLines = ['#d73027','#2166ac','#4d4d4d', '#f46d43','#4393c3','#878787', '#fdae61','#92c5de','#bababa'];
        var data = [];
        

        data_types.forEach((data_type, data_type_index) => {
          rounds.forEach((round, round_index) => {
            var countArray = unpackWithCon(rows, 'size', 'round', round, 'is_attacker', data_type).map(Number);
            // console.log(countArray)
            var racountArray = unpackWithCon(rows, 'size', 'round', round, 'is_attacker', data_type).map(Number);
            // console.log(racountArray)
            if (protocol == 'UDP') {
              countArray = countArray.map(value => isNaN(value) ? 0 : value);
              var ratio = 1;
              // var ratio = Math.max.apply(Math, racountArray) / 1000;
              countArray = countArray.map(function (v) {
                return Math.ceil(v / ratio)+20;
              });
              if (data_type == 'other') {
                // console.log(countArray)
                countArray = countArray.map(function (v) {
                return Math.ceil(v / 2);
              });
                // console.log(countArray)
              }
            }
            else { 
              var ratio = 20
              if (data_type == 'other') {
                ratio = 10
              }
              countArray = countArray.map(function (v) {
                return Math.round(v * ratio);
              });
            }

            var trace = {}
            if (graphMode == 'lines') {
              trace = {
                x: unpackWithCon(rows, cx, 'round', round, 'is_attacker', data_type), y: unpackWithCon(rows, cy, 'round', round, 'is_attacker', data_type), z: unpackWithCon(rows, cz, 'round', round, 'is_attacker', data_type),
                type: 'scatter3d',
                mode: graphMode,
                opacity: 1,
                line: {
                  width: 6,
                  reversescale: false,
                  color: colorsForLines[round_index * 3 + data_type_index],
                  // dash:line_type[data_type_index],
                },
                connectgaps: true,
                hovertemplate: '<br><b>X</b>: %{x}<br>' +
                  '<br><b>Y</b>: %{y}<br>' +
                  '<br><b>Z</b>: %{z}<br>' +
                  '<br><b>Count</b>: <b>%{text}</b>',
                text: unpackWithCon(rows, 'size', 'round', round, 'is_attacker', data_type).map(Number),
                marker: {
                  size: countArray,
                  symbol: shape[data_type_index],
                  color: colors[round_index],
                  sizemode: 'area',
                  opacity: 1,
                  sizeref: 1,
                },
                name: data_type.concat(" ", round, " (", racountArray.filter(x => !isNaN(x)).length.toLocaleString(),")"),
              };

            }
            else {
              trace = {
                x: unpackWithCon(rows, cx, 'round', round, 'is_attacker', data_type), y: unpackWithCon(rows, cy, 'round', round, 'is_attacker', data_type), z: unpackWithCon(rows, cz, 'round', round, 'is_attacker', data_type),
                type: 'scatter3d',
                mode: graphMode,
                // opacity: 1,
                hovertemplate: '<br><b>X</b>: %{x}<br>' +
                  '<br><b>Y</b>: %{y}<br>' +
                  '<br><b>Z</b>: %{z}<br>' +
                  '<br><b>Count</b>: <b>%{text}</b>',
                text: unpackWithCon(rows, 'size', 'round', round, 'is_attacker', data_type).map(Number),
                marker: {
                  size: countArray,
                  symbol: shape[data_type_index],
                  color: colorsForLines[round_index * 3 + data_type_index],
                  // color: colors[round_index],
                  sizemode: 'area',
                  opacity: 1,
                  sizeref: grdot_size,
              line: {
                  color: 'rgba(0, 0, 0, 1)',
                  width: 0.0001,
                  opacity: 0.01,
              },
                },
                name: data_type.concat(" ", round, " (", racountArray.filter(x => !isNaN(x)).length.toLocaleString(),")"),
              };
            }
            data.push(trace);
          });
        });
        


        var layout = {
          // scene_xaxis = dict(exponentformat= "none", 
          //                            separatethousands= True,),
          scene: {
            xaxis: { title: axisName[cx],tickformat: "digits"},
            yaxis: { title: axisName[cy],tickformat: "digits"},
            zaxis: { title: axisName[cz],tickformat: "digits"},
          },
          legend: {
            x: 0,
            y: 1,
            traceorder: 'normal',
            itemsizing: 'constant',
            font: {
              family: 'sans-serif',
              size: 12,
              color: '#000'
            },
            bgcolor: '#E2E2E2',
            bordercolor: '#FFFFFF',
            borderwidth: 2
          },
          autosize: true,
          // width: 800,
          height: 800,
          title: title,
          margin: {
            l: 0,
            r: 0,
            b: 20,
            t: 25
          },
        // sliders: [{
        //   currentvalue: {prefix: 'Sizeref: '},
        //   pad: {t: 50},
        //   len: 0.9,
        //   x: 0.1,
        //   y: 0,
        //   steps: Array.from({length: 20}, (_, i) => ({
        //     method: 'relayout',
        //     args: [{'marker.sizeref': (i+1)/10}],
        //     label: `${(i+1)/10}`,
        //   })),
        // }]      
        };
        if (rows.length == 0) {
          d3.select(graphId).html("<h5>No Data</h5>")
        } else {
          d3.select(graphId).html("")
          Plotly.newPlot(graphName, data, layout);
      //     var sizerefSlider = document.getElementById('sizeref-slider');
      // sizerefSlider.addEventListener('input', function() {
      //   var sizeref = parseFloat(this.value);
      //   var update = {
      //     'marker.sizeref': sizeref
      //   };
      //   Plotly.relayout('graph1', update);
      //   // Plotly.relayout('graph2', update);
      // });
        }
      });
    }

    d3.select("#draw1").on("click", function (d) {
      drawGraph("graph1", "#graph1", "#f1");
    })

    d3.select("#draw2").on("click", function (d) {
      drawGraph("graph2", "#graph2", "#f2");
    })

  </script>
